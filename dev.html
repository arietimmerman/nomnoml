<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A tool for drawing sassy UML diagrams based on syntax. Provides instant feedback and has a customizable styling.">
<title>nomnoml - Development</title>
<link rel="stylesheet" href="codemirror/codemirror.css">
<link rel="stylesheet" href="codemirror/solarized.nomnoml.css">
<link rel="stylesheet" href="nomnoml.css?v=1">
<link rel="shortcut icon" href="favicon.png">
</head>
<body>
	<div class="wrap">
		<canvas id="canvas"></canvas>
		<textarea id="textarea" spellcheck="false"></textarea>
		<div id="linenumbers"></div>
		<div id="canvas-panner">
			<div canvas-tools></div>
		</div>

		<div id="reference" class="sidebar">
			<div class="content">
				<h2>Development Mode</h2>
				<p>This is the development version of nomnoml. Changes to the source code will be reflected immediately.</p>
			</div>
		</div>

		<div id="about" class="sidebar">
			<div class="content">
				<h2>Welcome to nomnoml</h2>
				<p>A tool for drawing UML diagrams based on a simple syntax.</p>
				<p>This is the development version with live reloading.</p>
			</div>
		</div>

		<div id="export" class="sidebar">
			<div class="content">
				<div export-menu></div>
			</div>
		</div>

		<div id="file" class="sidebar">
			<div class="content">
				<div file-menu></div>
			</div>
		</div>

		<div id="menu" class="sidebar">
			<div class="content">
				<div menu></div>
			</div>
		</div>
	</div>

	<!-- Load CodeMirror -->
	<script src="codemirror/codemirror-compressed.js"></script>
	<script src="codemirror/nomnoml.codemirror-mode.js"></script>
	
	<!-- Load the development version of the app -->
	<script type="module" src="/webapp/dev-entry.ts"></script>
</body>
</html>
